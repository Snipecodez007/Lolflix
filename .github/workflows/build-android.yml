name: Build Android APKs

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish a GitHub Release with the APKs'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_DIR: packages/lolflix_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true

      # ---------- Rust torrent engine (librqbit_ffi.so for every ABI) ----------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rqbit_ffi/rust

      - name: Accept Android licenses and make sure an NDK exists
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          fi

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - name: Build rqbit_ffi (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          cd packages/rqbit_ffi/rust
          cargo ndk --platform 21 -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../android/src/main/jniLibs build --release
          find ../android/src/main/jniLibs -name '*.so' -exec ls -la {} \;
          test -f ../android/src/main/jniLibs/arm64-v8a/librqbit_ffi.so

      # ---------- Secrets -> config files ----------
      - name: Prepare .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > "$APP_DIR/.env"
          else
            cp .env.example "$APP_DIR/.env"
            echo "::warning::ENV_FILE secret not set - using .env.example (Watch Party, Simkl, sync etc. need real values)"
          fi

      - name: Prepare google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          F="$APP_DIR/android/app/google-services.json"
          if [ -n "$GSJ" ]; then
            echo "$GSJ" | base64 -d > "$F"
          else
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"lolflix-placeholder","storage_bucket":"lolflix-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.lolflix.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > "$F"
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret not set - using a placeholder (build works, Google Sign-In will not)"
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$APP_DIR/android/app/release.keystore"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > "$APP_DIR/android/key.properties"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - signing with a throw-away debug key (APKs install, but cannot update over older builds)"
          fi

      # ---------- Build ----------
      - name: Read app version
        id: ver
        run: |
          V=$(grep '^version:' "$APP_DIR/pubspec.yaml" | head -1 | awk '{print $2}' | cut -d+ -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: flutter pub get
        run: cd "$APP_DIR" && flutter pub get

      - name: Build split APKs (arm64-v8a, armeabi-v7a, x86_64)
        run: cd "$APP_DIR" && flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Build universal APK
        run: cd "$APP_DIR" && flutter build apk --release --build-number=${{ github.run_number }}

      - name: Collect and rename APKs
        run: |
          OUT="$APP_DIR/build/app/outputs/flutter-apk"
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp "$OUT/app-arm64-v8a-release.apk"   "dist/lolflix-$V.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/lolflix-$V-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"      "dist/lolflix-$V-x86_64.apk"
          cp "$OUT/app-release.apk"             "dist/lolflix-$V-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && ls -la)

      - uses: actions/upload-artifact@v4
        with:
          name: lolflix-apks
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: LOLFLIX ${{ steps.ver.outputs.version }}
          files: dist/*
          generate_release_notes: true
